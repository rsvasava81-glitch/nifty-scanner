name: Market Breakout Scanner

on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance requests

      - name: Run scanner script
        env:
          TELEGRAM_BOT_TOKEN: "8883124725:AAHAF8SGg3MkpliUPoBcJr8S30mlBQ15K9w"
          CHAT_ID: "7161195228"
        run: |
          python scanner.py

      - name: Commit and push trade log if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add trade_log.csv
          git diff --staged --quiet || git commit -m "Auto-update trade log [skip ci]"
          git push
