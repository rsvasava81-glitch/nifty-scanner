name: Market Breakout Scanner

on:
  schedule:
    - cron: '*/5 9-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run python scanner.py
        env:
          SAHI_KEY_ID: ${{ secrets.SAHI_KEY_ID }}
          SAHI_SECRET: ${{ secrets.SAHI_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python scanner.py
